<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media queries</title>
    <link rel="stylesheet" href="./styles/base.css" />

    <!-- SOLO MODIFICAR EL ARCHIVO STYLE.CSS -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <img
          class="card__image"
          src="./img/gameboy.jpg"
          alt="Consola Game Boy"
        />
        <div class="card__content">
          <span class="card__category">Consola retro</span>
          <h1 class="card__title">Game Boy</h1>
          <p class="card__description">
            La Game Boy original, lanzada por Nintendo en abril de 1989,
            revolucionó la industria de los videojuegos al ofrecer
            entretenimiento portátil de calidad.
          </p>
          <h2 class="card__price">$99</h2>
          <button class="card__button">Agregar al carrito</button>
        </div>
      </div>
    </main>
  </body>
</html>
