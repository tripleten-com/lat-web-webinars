<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Registro - Validación Completa</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="container">
    <form class="form" novalidate>
        <h2 class="form__title">Crear Cuenta</h2>

        <label class="form__field">
            Nombre completo
            <input
                    id="name-input"
                    class="form__input"
                    type="text"
                    required
                    minlength="2"
                    placeholder="Juan Pérez"
            />
            <span class="name-input-error form__input-error"></span>
        </label>

        <label class="form__field">
            Email
            <input
                    id="email-input"
                    class="form__input"
                    type="email"
                    required
                    placeholder="ejemplo@correo.com"
            />
            <span class="email-input-error form__input-error"></span>
        </label>

        <label class="form__field">
            Contraseña
            <input
                    id="password-input"
                    class="form__input"
                    type="password"
                    required
                    minlength="8"
                    placeholder="Mínimo 8 caracteres"
            />
            <span class="password-input-error form__input-error"></span>
        </label>

        <label class="form__field">
            Teléfono
            <input
                    id="phone-input"
                    class="form__input"
                    type="tel"
                    required
                    minlength="10"
                    placeholder="1234567890"
            />
            <span class="phone-input-error form__input-error"></span>
        </label>

        <button
                type="submit"
                class="form__submit form__submit_disabled"
                disabled
        >
            Crear Cuenta
        </button>
    </form>

    <div id="success-message" class="success-message">
        ✅ ¡Formulario enviado correctamente! Cuenta creada con éxito.
    </div>
</div>

<script src="scripts/functions/showInputError.js"></script>
<script src="scripts/functions/hideInputError.js"></script>
<script src="scripts/functions/hasInvalidInput.js"></script>
<script src="scripts/functions/toggleButtonState.js"></script>
<script src="scripts/functions/setEventListeners.js"></script>

<script src="scripts/index.js"></script>
</body>
</html>
